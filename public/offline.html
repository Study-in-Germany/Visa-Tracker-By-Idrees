<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Visa Tracker</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ffffff;color:#0f172a;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center}
  h1{font-weight:700;font-size:24px;letter-spacing:-0.02em;margin:0 0 8px}
  p{margin:0 0 20px;color:#64748b;font-size:14px;line-height:1.5;max-width:340px}
  button{font:inherit;font-size:14px;font-weight:600;background:#0f172a;color:#ffffff;border:0;border-radius:8px;padding:10px 18px;min-height:48px;cursor:pointer}
  @media (prefers-color-scheme: dark){body{background:#0a0a0a;color:#fafafa}p{color:#a3a3a3}button{background:#fafafa;color:#0a0a0a}}
</style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Visa Tracker needs a connection to load live applicant data. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
