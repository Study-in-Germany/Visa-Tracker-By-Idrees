services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: visa_tracker
      POSTGRES_PASSWORD: local-development
      POSTGRES_DB: visa_tracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visa_tracker -d visa_tracker"]
      interval: 2s
      timeout: 5s
      retries: 20

  db-init:
    build: .
    environment: &app-environment
      DATABASE_URL: postgresql://visa_tracker:local-development@db:5432/visa_tracker
      DIRECT_URL: postgresql://visa_tracker:local-development@db:5432/visa_tracker
      AUTH_SECRET: ${AUTH_SECRET:-docker-local-development-secret-change-before-deployment}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate:deploy"]

  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment: *app-environment
    depends_on:
      db-init:
        condition: service_completed_successfully

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: visa_tracker
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: visa_tracker_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visa_tracker -d visa_tracker_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  test:
    build: .
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql://visa_tracker:test-only@test-db:5432/visa_tracker_test
    depends_on:
      test-db:
        condition: service_healthy
    command: ["npm", "test"]

volumes:
  postgres-data:
